<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic HTML Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 1.5rem;
      background-color: #f5f5f5;
      color: #333;
    }
    header {
      background-color: #0073e6;
      color: white;
      padding: 1rem;
      border-radius: 8px;
    }
    section {
      margin-top: 1rem;
      padding: 1rem;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to the Basic HTML Page</h1>
  </header>
  <section>
    <p>This is a simple HTML page with a header and content section.</p>
    <p>Use this file as a starting point for your website or project.</p>
  </section>
</body>
</html>
